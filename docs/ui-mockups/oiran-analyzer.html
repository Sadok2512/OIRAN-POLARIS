      <div className="flex flex-wrap gap-1.5" role="group" aria-label="Interfaces">${Object.keys(itfs).map((i) => html`<button key=${i} aria-pressed=${itfs[i]} onClick=${() => setItfs({ ...itfs, [i]: !itfs[i] })}
        className=${'h-9 px-3 rounded-md border text-sm2 font-semibold mono ' + (itfs[i] ? TONES[ifTone(i)] + ' border-transparent' : 'border-line text-mute')}>${i}</button>`)}</div>
      <div className="flex flex-wrap gap-1.5 ml-auto">${CORR.slice(0, 4).map(([p, c]) => html`<span key=${p} className="inline-flex items-center gap-1.5 text-sm2 text-mute">${p} <${Pill} tone=${confTone(c)}>${c}</${Pill}></span>`)}</div>
    </div>
    <div className="grid gap-5 xl:grid-cols-[minmax(0,1fr)_360px] items-start">
      <${Card} className="overflow-hidden"><div className="overflow-auto max-h-[720px]"><${Ladder} events=${events} sel=${sel} onSel=${setSel} /></div>
        <div className="flex flex-wrap items-center justify-between gap-2 px-4 py-2.5 border-t border-line text-sm2 text-mute"><span>${events.length} of ${EVENTS.length} session events · 0 background · 0 unmatched</span>
          <span className="flex gap-3">${Object.keys(itfs).map((i) => html`<span key=${i} className="inline-flex items-center gap-1"><span className=${'h-0.5 w-4 ' + { N2: 'bg-brand', SBI: 'bg-ok', N4: 'bg-warn', N3: 'bg-vio' }[i]}></span>${i}</span>`)}</span></div></${Card}>
      ${e && html`<${Inspector} key=${e.event_id} e=${e} />`}
    </div>`;
}

/* ---------------- Correlation ---------------- */
const LINKC = ['STRONG', 'STRONG', 'POSSIBLE'];
function Correlation() {
  return html`<${PageHeader} eyebrow="Investigate · 5g-session-18fe28a814c4b094" title="Correlation" desc="How the N2, SBI, N4 and N3 legs of one session are tied together, with the rule and identifiers behind each link." />
    <div className="grid gap-3 grid-cols-2 lg:grid-cols-5">${CORR.map(([p, c]) => html`<${Card} key=${p} className="p-4 flex flex-col gap-2"><p className="text-xs2 font-semibold uppercase tracking-wider text-mute">${p}</p><span className="self-start"><${Pill} tone=${confTone(c)}>${c}</${Pill}></span></${Card}>`)}</div>
    <${Card} className="p-5 overflow-x-auto">
      <div className="min-w-[640px] flex items-center justify-between gap-2">
        ${['N2', 'SBI', 'N4', 'N3'].map((i, k, arr) => html`<div key=${i} className="contents">
          <div className="flex-1 rounded-xl border border-line p-3 text-center"><${IfChip} i=${i} /><p className="mt-1.5 text-sm2 text-mute">${EVENTS.filter((e) => e.interface === i).length} event${EVENTS.filter((e) => e.interface === i).length > 1 ? 's' : ''}</p></div>
          ${k < arr.length - 1 && html`<div className="flex flex-col items-center gap-1 w-28"><${Pill} tone=${confTone(LINKC[k])}>${LINKC[k]}</${Pill}><div className="h-0.5 w-full bg-line"></div></div>`}</div>`)}
      </div></${Card}>
    <${Card} className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full min-w-[820px] text-md2">
      <thead><tr className="text-left text-xs2 uppercase tracking-wider text-mute border-b border-line">${['Link', 'From → to', 'Matched on', 'Rule', 'Confidence', 'Limitations'].map((h, i) => html`<th key=${h} className=${'py-2.5 font-semibold ' + (i ? 'px-3' : 'px-4')}>${h}</th>`)}</tr></thead>
      <tbody>${EDGES.map((x) => html`<tr key=${x.edge_id} className="border-b border-line last:border-0">
        <td className="px-4 py-3 font-medium whitespace-nowrap">${x.pair}</td><td className="px-3 py-3 mono text-sm2 whitespace-nowrap">#${+x.from.slice(3)} → #${+x.to.slice(3)}</td>
        <td className="px-3 py-3 text-sm2">${x.ids.join(', ')}</td><td className="px-3 py-3 mono text-xs2">${x.rule} v${x.ver}</td>
        <td className="px-3 py-3"><${Pill} tone=${confTone(x.confidence)}>${x.confidence}</${Pill}></td><td className="px-3 py-3 text-sm2 text-mute">${x.limitation || '—'}</td></tr>`)}</tbody></table></div></${Card}>
    <p className="text-sm2 text-mute">Confidence is the engine's verdict per rule. Exact = identical tunnel or context identifier on both sides; Possible = consistent but not unique in this capture window.</p>`;
}

/* ---------------- Packets ---------------- */
function Packets() {
  const [sel, setSel] = useState('ev-011');
  const p = EVENTS.find((x) => x.event_id === sel);
  return html`<${PageHeader} eyebrow="Evidence" title="Packets" desc="Every decoded frame with its exact position in the source capture. Raw bytes are not shown in the analyzer." />
    <div className="grid gap-5 xl:grid-cols-[minmax(0,1fr)_360px] items-start">
      <${Card} className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full min-w-[760px] text-md2">
        <thead><tr className="text-left text-xs2 uppercase tracking-wider text-mute border-b border-line">${['Frame', 'Time (UTC)', 'Interface', 'Path', 'Message', 'Length', 'Decode'].map((h, i) => html`<th key=${h} className=${'py-2.5 font-semibold ' + (i ? 'px-3' : 'px-4') + (h === 'Length' ? ' text-right' : '')}>${h}</th>`)}</tr></thead>
        <tbody>${EVENTS.map((e) => html`<tr key=${e.event_id} onClick=${() => setSel(e.event_id)} aria-selected=${sel === e.event_id}
          className=${'border-b border-line last:border-0 cursor-pointer ' + (sel === e.event_id ? 'bg-brand-soft' : 'hover:bg-canvas')}>
          <td className="px-4 py-2.5 num">${e.packet_number}</td><td className="px-3 py-2.5 mono text-sm2">${e.timestamp}</td>
          <td className="px-3 py-2.5"><span className="inline-flex items-center gap-1.5"><${IfChip} i=${e.interface} /><span className="text-sm2 text-mute">${e.protocol}</span></span></td>
          <td className="px-3 py-2.5 mono text-sm2 whitespace-nowrap">${e.source_participant} → ${e.destination_participant}</td>
          <td className="px-3 py-2.5 max-w-[240px] truncate">${e.message_name}</td><td className="px-3 py-2.5 num text-right">${e.captured_length}</td>
          <td className="px-3 py-2.5"><${Pill} tone=${decTone(e.decoding_status)}>${e.decoding_status === 'ENCRYPTED_OR_PROTECTED' ? 'PROTECTED' : e.decoding_status}</${Pill}></td></tr>`)}</tbody></table></div></${Card}>
      ${p && html`<${Card} className="p-4 flex flex-col gap-3 xl:sticky xl:top-4">
        <div><p className="text-xs2 font-semibold uppercase tracking-wider text-mute">Frame ${p.packet_number}</p><h2 className="text-xl2 font-semibold">${p.message_name}</h2></div>
        <dl className="grid grid-cols-2 gap-x-4 gap-y-3"><${Field} k="Source file" v=${'capture://' + p.interface + '.pcap'} mono /><${Field} k="Byte offset" v=${String(p.byte_offset)} mono />
          <${Field} k="Captured / original" v=${p.captured_length + ' / ' + p.captured_length + ' B'} mono /><${Field} k="Interface id" v="0" mono /></dl>
        <div className="border-t border-line pt-3"><p className="text-xs2 font-semibold uppercase tracking-wider text-mute mb-1">Information elements</p><${IeTree} nodes=${IE_TREES[p.protocol] || []} /></div>
        <div className="flex flex-wrap gap-2 border-t border-line pt-3"><${Btn} icon="flow" onClick=${() => go('callflow')}>Show in call flow</${Btn}>
          <${Locked} reason="GET /captures/:id/download is not served yet (404)">Download frame</${Locked}></div>
      </${Card}>`}
    </div>`;
}

/* ---------------- Datasets ---------------- */
function Datasets() {
  return html`<${PageHeader} eyebrow="Evidence" title="Datasets" desc="What the analyzer reads from: live captures from Probe Manager, imported files and recovered checkpoints. All read-only." />
    <div className="grid gap-5 lg:grid-cols-3">${DATASETS.map((d) => html`<${Card} key=${d.dataset_id} className="p-5 flex flex-col gap-4">
      <div className="flex items-start justify-between gap-2"><div className="min-w-0"><h2 className="text-xl2 font-semibold truncate">${d.name}</h2><p className="mono text-xs2 text-mute truncate">${d.dataset_id}</p></div>
        <${Pill} tone=${kindTone(d.kind)}>${d.kind.replace('_', ' ')}</${Pill}></div>
      <dl className="grid grid-cols-3 gap-3"><${Field} k="Sessions" v=${String(d.sessions)} mono /><${Field} k="Events" v=${String(d.events)} mono /><${Field} k="Packets" v=${d.packets.toLocaleString('en-US')} mono /></dl>
      <dl className="grid grid-cols-2 gap-3"><${Field} k="Source" v=${d.source} /><${Field} k="Ingestion" v=${d.status} mono /><${Field} k="Accounting" v=${d.accounting} mono /><${Field} k="Access" v=${d.read_only ? 'Read-only' : 'Writable'} /></dl>
      <div className="flex flex-wrap gap-1.5 border-t border-line pt-3">${Object.entries(d.decoders).map(([k, v]) => html`<span key=${k} className="mono text-xs2 rounded border border-line px-1.5 py-0.5">${k} ${v}</span>`)}</div>
      <button onClick=${() => go('sessions')} className="self-start text-sm2 text-brand inline-flex items-center gap-1">Open sessions <${Icon} name="arrow" size=${13} /></button></${Card}>`)}</div>`;
}

/* ---------------- Exports ---------------- */
function Exports() {
  const rows = [
    ['Call flow · HTML', 'Self-contained page of the ladder, IE trees and correlation', true],
    ['Call flow · JSON', 'callflow-schema document with events, edges and accounting', true],
    ['Session summary · CSV', 'One row per session for the current filters', true],
    ['PCAP slice of a session', 'Only the frames of one session, from the source captures', false]
  ];
  return html`<${PageHeader} eyebrow="Evidence" title="Exports" desc="Take evidence out of the analyzer. Exports never contain subscriber identities." />
    <${Card} className="overflow-hidden"><ul className="divide-y divide-line">${rows.map(([t, d, ok]) => html`<li key=${t} className="px-5 py-4 flex flex-wrap items-center justify-between gap-3">
      <div className="min-w-0"><p className="font-medium">${t}</p><p className="text-sm2 text-mute">${d}</p></div>
      ${ok ? html`<${Btn} icon="download">Export</${Btn}>` : html`<${Locked} reason="Needs GET /captures/:id/download, not served yet">Export</${Locked}>`}</li>`)}</ul></${Card}>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
