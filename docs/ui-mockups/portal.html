<title>Telecom Platform Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — collapsible sidebar + content; probe list with a sticky inspector. Tokens follow packages/ui/src/tokens.ts (Enterprise Precision). */
:root {
  --c-background: #F5F7FA; --c-surface: #FFFFFF; --c-sidebar: #F0F4F9; --c-text-primary: #17283F;
  --c-text-secondary: #5B6A80; --c-border: #DEE5ED; --c-primary: #2563EB; --c-primary-soft: #E8EFFD;
  --c-success: #047857; --c-success-soft: #E3F4EC; --c-warning: #B45309; --c-warning-soft: #FDF1E1;
  --c-error: #DC2626; --c-error-soft: #FDECEC; --c-violet: #6D4AD9; --c-violet-soft: #EFEBFC;
  --c-track: #E8EDF3;
  --shadow-1: 0 1px 2px rgba(23,40,63,.06); --shadow-2: 0 8px 24px rgba(23,40,63,.10);
  --font-sans: Inter, "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --c-background: #0B1220; --c-surface: #152238; --c-sidebar: #101B2C; --c-text-primary: #E7F0FF;
  --c-text-secondary: #9AAAC0; --c-border: #2A3A54; --c-primary: #5B93F7; --c-primary-soft: #1A2C4D;
  --c-success: #34D399; --c-success-soft: #123528; --c-warning: #FBBF24; --c-warning-soft: #3A2A10;
  --c-error: #F87171; --c-error-soft: #3B1A1D; --c-violet: #A894F5; --c-violet-soft: #251D45;
  --c-track: #22324B; --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 8px 24px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --c-background: #0B1220; --c-surface: #152238; --c-sidebar: #101B2C; --c-text-primary: #E7F0FF;
  --c-text-secondary: #9AAAC0; --c-border: #2A3A54; --c-primary: #5B93F7; --c-primary-soft: #1A2C4D;
  --c-success: #34D399; --c-success-soft: #123528; --c-warning: #FBBF24; --c-warning-soft: #3A2A10;
  --c-error: #F87171; --c-error-soft: #3B1A1D; --c-violet: #A894F5; --c-violet-soft: #251D45;
  --c-track: #22324B; --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 8px 24px rgba(0,0,0,.45); color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--c-background); color: var(--c-text-primary); font-family: var(--font-sans); font-size: 13px; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01","cv11"; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
table { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; border-radius: 4px; }
h1, h2 { text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@keyframes pulse-dot { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
.live-dot { animation: pulse-dot 1.6s ease-in-out infinite; }
</style>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  darkMode: ['class', '[data-theme="dark"]'],
  theme: { extend: {
    colors: {
      canvas: 'var(--c-background)', surface: 'var(--c-surface)', sidebar: 'var(--c-sidebar)', line: 'var(--c-border)',
      ink: 'var(--c-text-primary)', mute: 'var(--c-text-secondary)', brand: 'var(--c-primary)', 'brand-soft': 'var(--c-primary-soft)',
      ok: 'var(--c-success)', 'ok-soft': 'var(--c-success-soft)', warn: 'var(--c-warning)', 'warn-soft': 'var(--c-warning-soft)',
      bad: 'var(--c-error)', 'bad-soft': 'var(--c-error-soft)', vio: 'var(--c-violet)', 'vio-soft': 'var(--c-violet-soft)', track: 'var(--c-track)'
    },
    fontSize: { xs2: ['11px', '1.4'], sm2: ['12px', '1.5'], base2: ['13px', '1.55'], md2: ['14px', '1.55'], xl2: ['18px', '1.4'], h2: ['22px', '1.3'], h1: ['26px', '1.25'] },
    boxShadow: { e1: 'var(--shadow-1)', e2: 'var(--shadow-2)' }
  } }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<div id="root"></div>
<script>
const { useState, useEffect } = React;
const html = htm.bind(React.createElement);

/* lucide-style icons (same set as apps/portal) */
const ico = (d) => ({ size = 20 }) => html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${d.map((p, i) => html`<path key=${i} d=${p} />`)}</svg>`;
const Sliders = ico(['M21 4h-7', 'M10 4H3', 'M21 12h-9', 'M8 12H3', 'M21 20h-5', 'M12 20H3', 'M14 2v4', 'M8 10v4', 'M16 18v4']);
const Radio = ico(['M4.9 19.1C1 15.2 1 8.8 4.9 4.9', 'M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5', 'M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5', 'M19.1 4.9C23 8.8 23 15.1 19.1 19', 'M12 12h.01']);
const Activity = ico(['M22 12h-4l-3 9L9 3l-3 9H2']);
const External = ico(['M15 3h6v6', 'M10 14 21 3', 'M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6']);
const Sun = ico(['M12 2v2', 'M12 20v2', 'm4.93 4.93 1.41 1.41', 'm17.66 17.66 1.41 1.41', 'M2 12h2', 'M20 12h2', 'm6.34 17.66-1.41 1.41', 'm19.07 4.93-1.41 1.41', 'M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0']);
const Moon = ico(['M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z']);
const Monitor = ico(['M2 3h20v14H2z', 'M8 21h8', 'M12 17v4']);
const Lock = ico(['M5 11h14v10H5z', 'M7 11V7a5 5 0 0 1 10 0v4']);

/* Example data only. In apps/portal the health line comes from an anonymous GET on each app's own API base. */
const APPS = [
  {
    id: 'polaris', name: 'POLARIS Control', tagline: 'Core · RAN · UE · Scenarios', Icon: Sliders, accent: 'blue',
    description: 'Operate the 5G SA lab: Open5GS core functions, gNodeBs and eNB, network topology, UE profiles and bounded scenarios.',
    scope: ['Open5GS', 'gNB / eNB', 'Topology', 'UE Manager', 'Scenarios'],
    health: { state: 'ok', detail: 'ok · 42 ms' }, api: '/polaris-api/v1/system/health', href: 'polaris-control.html'
  },
  {
    id: 'probe-manager', name: 'Probe Manager', tagline: 'vProbes · Physical probes · Captures', Icon: Radio, accent: 'purple',
    description: 'Register and supervise probes, each with several capture interfaces. Follow live captures, disk budget and the capture library.',
    scope: ['Probes', 'Interfaces', 'Live captures', 'Library'],
    health: { state: 'ok', detail: 'ok · 18 ms' }, api: '/api/v1/health', href: 'probe-manager.html'
  },
  {
    id: 'oiran-analyzer', name: 'OIRAN Analyzer', tagline: 'Call flow · Correlation · Packet forensics', Icon: Activity, accent: 'teal',
    description: 'Reconstruct sessions, inspect decoded IE trees, correlate N2 ↔ SBI ↔ N4 ↔ N3 evidence across datasets.',
    scope: ['Sessions', 'Call flow', 'Correlation', 'Packets', 'Datasets'],
    health: { state: 'auth-required', detail: 'Reachable, authentication required (401)' }, api: '/api/v1/health', href: 'oiran-analyzer.html'
  }
];

const ACCENT = {
  blue: 'bg-brand-soft text-brand ring-brand',
  purple: 'bg-vio-soft text-vio ring-vio',
  teal: 'bg-ok-soft text-ok ring-ok'
};
const DOT = {
  ok: ['Healthy', 'bg-ok'], 'auth-required': ['Auth required', 'bg-warn'],
  degraded: ['Degraded', 'bg-bad'], unknown: ['Unknown', 'bg-mute']
};

function StatusDot({ state }) {
  const [label, color] = DOT[state];
  return html`<span className="inline-flex items-center gap-1.5" aria-label=${label}>
    <span className=${'h-2 w-2 rounded-full ' + color + (state === 'ok' ? ' live-dot' : '')}></span>
    <span className="text-xs2 text-mute">${label}</span></span>`;
}

function ThemeSwitch() {
  const [pref, setPref] = useState('system');
  useEffect(() => {
    const r = document.documentElement;
    if (pref === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', pref);
  }, [pref]);
  const opts = [['light', 'Light', Sun], ['dark', 'Dark', Moon], ['system', 'System', Monitor]];
  return html`<div className="inline-flex items-center gap-1 rounded-md border border-line bg-canvas p-0.5" role="radiogroup" aria-label="Theme">
    ${opts.map(([v, l, I]) => html`<button key=${v} type="button" role="radio" aria-checked=${pref === v} aria-label=${l}
      onClick=${() => setPref(v)}
      className=${'inline-flex items-center justify-center h-7 w-7 rounded transition-colors ' + (pref === v ? 'bg-surface text-ink shadow-e1' : 'text-mute hover:text-ink')}>
      <${I} size=${14} /></button>`)}
  </div>`;
}

function AppCard({ app }) {
  const { Icon } = app;
  return html`<article className="bg-surface border border-line rounded-lg shadow-e1 p-5 flex flex-col gap-4 transition-transform hover:-translate-y-px">
    <header className="flex items-start justify-between gap-3">
      <div className=${'inline-flex items-center justify-center h-11 w-11 rounded-md ring-1 ring-opacity-25 ' + ACCENT[app.accent]}><${Icon} /></div>
      <${StatusDot} state=${app.health.state} />
    </header>
    <div className="flex-1 flex flex-col gap-2">
      <div>
        <p className="text-xs2 font-medium uppercase tracking-wider text-mute">${app.tagline}</p>
        <h2 className="text-xl2 font-semibold mt-0.5">${app.name}</h2>
      </div>
      <p className="text-base2 text-mute">${app.description}</p>
      <ul className="flex flex-wrap gap-1.5 mt-1" aria-label="Scope">
        ${app.scope.map((s) => html`<li key=${s} className="px-2 h-6 inline-flex items-center rounded border border-line bg-canvas text-xs2 text-mute">${s}</li>`)}
      </ul>
    </div>
    <footer className="flex items-center justify-between gap-3 pt-3 border-t border-line">
      <span className="text-xs2 text-mute min-w-0">
        <span className="block truncate">${app.health.detail}</span>
        <span className="block mono truncate opacity-80">GET ${app.api}</span>
      </span>
      ${app.href
        ? html`<a href=${app.href} target="_blank" rel="noopener noreferrer"
            className="shrink-0 inline-flex items-center gap-1.5 h-9 px-3 rounded-md bg-brand text-white text-sm2 font-medium hover:opacity-90">
            Open application <${External} size=${14} /></a>`
        : html`<span title="No mockup for OIRAN Analyzer — the app is unchanged"
            className="shrink-0 inline-flex items-center gap-1.5 h-9 px-3 rounded-md border border-dashed border-line text-sm2 text-mute">
            <${Lock} size=${14} /> Unchanged · no mockup</span>`}
    </footer>
  </article>`;
}

function App() {
  return html`<div className="min-h-screen flex flex-col">
    <header className="border-b border-line bg-surface sticky top-0 z-10">
      <div className="mx-auto max-w-6xl px-4 sm:px-6 h-14 flex items-center justify-between gap-3">
        <div className="flex items-center gap-3">
          <div className="h-7 w-7 rounded bg-brand text-white flex items-center justify-center text-sm2 font-semibold">T</div>
          <div><p className="text-xs2 uppercase tracking-wider text-mute">Telecom Platform</p>
            <p className="text-sm2 font-medium leading-tight">Portal</p></div>
        </div>
        <div className="flex items-center gap-3">
          <span className="hidden sm:inline-flex px-2 h-6 items-center rounded border border-warn text-xs2 text-warn">Mockup — example data</span>
          <${ThemeSwitch} />
        </div>
      </div>
    </header>
    <main className="flex-1">
      <section className="mx-auto max-w-6xl px-4 sm:px-6 py-10">
        <header className="mb-8">
          <p className="text-xs2 font-semibold tracking-wider text-mute uppercase">Telecom Platform</p>
          <h1 className="text-h1 font-semibold mt-1">Choose a workspace</h1>
          <p className="text-md2 text-mute mt-2 max-w-2xl">Three independent applications share a common authentication, design system and API contract.
            Each opens in its own tab; the portal only displays reachability and does not embed them.</p>
        </header>
        <div className="grid gap-5 grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
          ${APPS.map((a) => html`<${AppCard} key=${a.id} app=${a} />`)}
        </div>
        <section className="mt-8 bg-surface border border-line rounded-lg p-4 text-sm2 text-mute flex flex-col gap-1">
          <p className="font-medium text-ink">Responsibilities</p>
          <p><span className="text-ink font-medium">POLARIS Control</span> drives the lab network: Open5GS core, gNodeBs and eNB, topology, UEs and scenarios.</p>
          <p><span className="text-ink font-medium">Probe Manager</span> manages probes only — virtual and physical, several interfaces each. Topology moved to POLARIS.</p>
          <p>Health is an anonymous GET on each app's own API base: no token is ever sent to a sibling app.</p>
        </section>
      </section>
    </main>
    <footer className="border-t border-line">
      <div className="mx-auto max-w-6xl px-4 sm:px-6 h-12 flex items-center justify-between text-xs2 text-mute">
        <span>Telecom Platform · Portal</span><span className="mono">:8020/portal/</span>
      </div>
    </footer>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
