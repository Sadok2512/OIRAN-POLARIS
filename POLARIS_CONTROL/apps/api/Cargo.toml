[package]
name = "polaris-control-api"
version = "0.15.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "=0.7.9"
job-registry = { path = "../../crates/job-registry" }
safety-guard = { path = "../../crates/safety-guard" }
scenario-engine = { path = "../../crates/scenario-engine" }
simulator-controller = { path = "../../crates/simulator-controller" }
traffic-engine = { path = "../../crates/traffic-engine" }
ueransim-adapter = { path = "../../crates/ueransim-adapter" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "=1.42.0", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "=0.6.2", features = ["fs", "set-header", "trace"] }
hyper-util = "=0.1.10"
argon2 = "=0.5.3"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rpassword = "=7.3.1"
base64ct = "=1.6.0"
sha2 = "=0.10.8"
csv = "=1.3.1"

[dev-dependencies]
http-body-util = "=0.1.2"
tower = { version = "=0.5.2", features = ["util"] }
