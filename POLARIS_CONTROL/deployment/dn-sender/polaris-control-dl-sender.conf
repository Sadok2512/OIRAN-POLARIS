[Service]
Environment=POLARIS_DL_SENDER_CONTAINER=polaris-dn-sender
Environment=POLARIS_DL_SENDER_NETWORK=oiran-lab-n6
Environment=POLARIS_DL_SENDER_IP=10.77.24.30
Environment=POLARIS_DL_SENDER_UPF_IP=10.77.24.13
# 0.29.2: POLARIS_LTE_TRAFFIC_PEER_IP is the DN endpoint reached through the
# LTE SGi path. It is now DECOUPLED from the 5G N6 sender above. The value
# below is a transitional default; once a dedicated LTE SGi DN is deployed
# (proposed address 10.77.16.30 with return route 10.45.0.0/16 via
# 10.77.16.15) point this at that endpoint instead. The runtime preflight
# requires the UE route to resolve via `tun_srsue` and the DN to have a
# usable return route; equality with POLARIS_DL_SENDER_IP is no longer
# enforced and is not required.
Environment=POLARIS_LTE_TRAFFIC_PEER_IP=10.77.24.30
