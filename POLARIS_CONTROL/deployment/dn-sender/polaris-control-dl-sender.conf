[Service]
# 5G N6 DN sender. This drop-in no longer sets any LTE SGi variable.
# The LTE SGi topology lives in deployment/dn-sender/lte-sgi/ and must be
# enabled explicitly after Codex confirms addressing and image digest.
Environment=POLARIS_DL_SENDER_CONTAINER=polaris-dn-sender
Environment=POLARIS_DL_SENDER_NETWORK=oiran-lab-n6
Environment=POLARIS_DL_SENDER_IP=10.77.24.30
Environment=POLARIS_DL_SENDER_UPF_IP=10.77.24.13
# 0.29.3: POLARIS_LTE_TRAFFIC_PEER_IP, POLARIS_LTE_DN_SENDER_CONTAINER and
# POLARIS_LTE_PGW_U_NEXT_HOP are intentionally NOT defined here. They must be
# configured by the LTE SGi drop-in (see lte-sgi/polaris-control-lte-sgi.conf)
# only after Codex reserves addresses and pins the sidecar image digest.
# Until configured, every LTE traffic step fails closed at the preflight stage
# with LTE_TRAFFIC_PEER_NOT_CONFIGURED / LTE_DN_SENDER_NOT_CONFIGURED /
# LTE_PGW_U_NEXT_HOP_NOT_CONFIGURED.
