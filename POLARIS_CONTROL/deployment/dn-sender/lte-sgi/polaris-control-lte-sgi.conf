[Service]
# ===================================================================
# LTE SGi DN sender — CANDIDATE drop-in. DO NOT activate verbatim.
# Values below are proposals; Codex must confirm addressing and
# image digest before this file is enabled in production.
# ===================================================================
#
# All variables are commented out so that any attempt to run an LTE
# traffic step while this drop-in is unactivated fails closed with
# precise codes (LTE_TRAFFIC_PEER_NOT_CONFIGURED,
# LTE_DN_SENDER_NOT_CONFIGURED, LTE_PGW_U_NEXT_HOP_NOT_CONFIGURED).
#
# Proposed addressing (to be reserved / confirmed by Codex):
#   LTE SGi DN sender container : polaris-lte-sgi-dn
#   LTE SGi DN IP               : 10.77.16.30/24 on network oiran-lab-sgi
#   LTE PGW-U LTE next hop      : 10.77.16.15
#   UE subnet (via tun_srsue)   : 10.45.0.0/16
#
# The POLARIS runtime refuses the 5G N6 container as the LTE DN
# (LTE_DN_SENDER_COLLIDES_WITH_N6) and refuses `POLARIS_LTE_TRAFFIC_PEER_IP ==
# POLARIS_DL_SENDER_IP` (LTE_SGI_COLLIDES_WITH_N6). Once Codex confirms, un-
# comment and set the four variables below.
#
# Environment=POLARIS_LTE_DN_SENDER_CONTAINER=polaris-lte-sgi-dn
# Environment=POLARIS_LTE_TRAFFIC_PEER_IP=10.77.16.30
# Environment=POLARIS_LTE_PGW_U_NEXT_HOP=10.77.16.15
# Environment=POLARIS_LTE_UE_SUBNET=10.45.0.0/16
# Environment=POLARIS_LTE_FORBIDDEN_RETURN_DEVS=lo,null0,blackhole,eth0,oiran-lab-n6
