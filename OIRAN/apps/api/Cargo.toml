[package]
name = "oiran-api"
version = "2.14.11"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
axum = "=0.7.9"
callflow-schema = { path = "../../callflow-schema" }
callflow-renderer = { path = "../../callflow-renderer" }
dataset-registry = { path = "../../dataset-registry" }
disk-safety = { path = "../../disk-safety" }
event-schema = { path = "../../event-schema" }
live-probe = { path = "../../live-probe" }
oiran-decode = { path = "../../oiran-decode" }
decoder-s1ap = { path = "../../decoder-s1ap" }
decoder-nas = { path = "../../decoder-nas" }
# 2.14.9 : patcher à la lecture étend le combined_message_name à NGAP
# (TS 38.413) + NAS 5GMM/5GSM (TS 24.501) ; même table publique
# consommée par l'ingestion.
decoder-ngap = { path = "../../decoder-ngap" }
correlation-engine = { path = "../../correlation-engine" }
session-engine = { path = "../../session-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "=1.42.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.17", features = ["sync"] }
tower-http = { version = "=0.6.2", features = ["fs", "set-header", "trace", "compression-gzip", "compression-br"] }
hyper-util = "=0.1.10"
libc = "0.2"

[dev-dependencies]
capture-helper = { path = "../../capture-helper" }
http-body-util = "=0.1.2"
tower = { version = "=0.5.2", features = ["util"] }
