[package]
name = "oiran-api"
version = "2.6.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "=0.7.9"
callflow-schema = { path = "../../callflow-schema" }
callflow-renderer = { path = "../../callflow-renderer" }
dataset-registry = { path = "../../dataset-registry" }
disk-safety = { path = "../../disk-safety" }
event-schema = { path = "../../event-schema" }
live-probe = { path = "../../live-probe" }
oiran-decode = { path = "../../oiran-decode" }
correlation-engine = { path = "../../correlation-engine" }
session-engine = { path = "../../session-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "=1.42.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "=0.6.2", features = ["fs", "set-header", "trace"] }
hyper-util = "=0.1.10"

[dev-dependencies]
capture-helper = { path = "../../capture-helper" }
http-body-util = "=0.1.2"
libc = "0.2"
tower = { version = "=0.5.2", features = ["util"] }
