[package]
name = "probe-agent"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "probe-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 0.1.1 — mTLS transport + capture-helper IPC. Pure-Rust TLS stack
# (rustls) rather than system OpenSSL so the agent binary stays
# cross-platform and reproducibly buildable.
tokio = { version = "=1.42.0", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "fs", "sync"] }
reqwest = { version = "=0.12.9", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
rustls = { version = "=0.23.19", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "=2.2.0"
capture-helper = { path = "../capture-helper" }

[dev-dependencies]
# E2E transport test: spin up a self-signed CA + server + client cert in
# the test, run the agent's mTLS transport against axum-server, mock
# the capture-helper over a Unix socket.
rcgen = { version = "=0.13.2", default-features = false, features = ["ring", "pem"] }
axum = "=0.7.9"
axum-server = { version = "=0.7.3", default-features = false, features = ["tls-rustls-no-provider"] }
tower = { version = "=0.5.2", features = ["util"] }
tempfile = "=3.14.0"
