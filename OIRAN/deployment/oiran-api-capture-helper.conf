# Review-only systemd drop-in for oiran-api.service.
# Install only together with the isolated helper after explicit authorization.
[Service]
Environment=OIRAN_CAPTURE_EXECUTION_ENABLED=1
Environment=OIRAN_CAPTURE_HELPER_SOCKET=/run/oiran/capture-helper.sock
Environment=OIRAN_CAPTURE_HELPER_UID=REPLACE_WITH_OIRAN_CAPTURE_UID
Environment=OIRAN_CAPTURE_ROOT=/var/lib/oiran/captures
SupplementaryGroups=oiran-capture
ReadWritePaths=/var/lib/oiran/captures
AmbientCapabilities=
CapabilityBoundingSet=
